<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --team: {{TEAM_COLOR}};
    --ink: #1B1F24;
    --muted: #5B6570;
    --rule: #D9DEE3;
    --paper: #FFFFFF;
    --wash: #F4F6F8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--wash); color: var(--ink);
    font: 16px/1.55 "Helvetica Neue", Arial, sans-serif;
  }
  .sheet {
    max-width: 820px; margin: 32px auto; background: var(--paper);
    border-top: 10px solid var(--team); padding: 40px 48px 56px;
  }
  .masthead {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin-bottom: 28px;
    font-size: 13px; color: var(--muted);
  }
  .masthead strong { color: var(--ink); font-size: 14px; letter-spacing: .02em; }
  h1 {
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: 34px; line-height: 1.15; margin: 0 0 6px;
  }
  h1 + p { color: var(--muted); margin-top: 0; }
  h2 {
    font-family: Georgia, "Times New Roman", serif; font-size: 21px;
    margin: 36px 0 10px; padding-left: 12px; border-left: 5px solid var(--team);
  }
  ul { padding-left: 22px; }
  li { margin: 4px 0; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 15px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
  th { background: var(--wash); font-weight: 700; }
  .footer { margin-top: 44px; padding-top: 12px; border-top: 1px solid var(--rule);
            font-size: 12px; color: var(--muted); }
  @media (max-width: 640px) { .sheet { margin: 0; padding: 24px 18px; } h1 { font-size: 26px; } }
  @media print { body { background: #fff; } .sheet { margin: 0; max-width: none; } }
</style>
</head>
<body>
  <main class="sheet">
    <div class="masthead"><strong>Communications Department · Pregame Game Notes</strong><span>{{GENERATED}}</span></div>
    {{CONTENT}}
    <div class="footer">Researched and drafted by the Game Notes Agent, verified by an automated
      fact-checker, and approved by a human editor. Data: ESPN public endpoints.</div>
  </main>
</body>
</html>
